name: CI (main)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Tests, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PAYLOAD_SECRET: ci-only-payload-secret
      SETUP_TOKEN: ci-only-setup-token
      SITE_TIMEZONE: Europe/Berlin

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Verify generated Payload artifacts
        run: |
          npm run generate:types
          npm run generate:importmap
          git diff --exit-code -- src/payload-types.ts 'src/app/(payload)/admin/importMap.js'

      - name: Run integration tests
        run: npm run test:int

      - name: Build production application
        env:
          DATABASE_URL: file:./data/ci.sqlite
          NODE_ENV: production
        run: |
          mkdir -p data
          npm run migrate
          npm run seed:empty
          npm run build

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm run test:e2e

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: e2e
    timeout-minutes: 25
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: synitio/trustred-cms:latest
